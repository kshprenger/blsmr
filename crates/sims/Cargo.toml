[package]
name = "sims"
version = "0.1.0"
edition = "2024"

[dependencies]
dscale = {workspace = true, features = ["mpi"]}
itertools = "0.14"
blsmr = {path = "../blsmr"}
client = {path = "../client"}
quorum = {path = "../quorum"}

[profile.release]
lto = "fat"           # Link Time Optimization: enables cross-crate optimizations
codegen-units = 1     # Reduces parallelism in code generation for better optimization
panic = "abort"       # Removes stack unwinding code, slightly smaller and faster binary
opt-level = 3         # Maximum optimization
debug = true          # Pretty flamegraph without losing performance
